[project]
name = "ordis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Azrael", email = "azrael@mutualzz.com" }]
requires-python = ">=3.14"
dependencies = [
    "ddgs>=9.16.0",
    "discord-py>=2.7.1",
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "keyboard>=0.13.5",
    "mss>=10.2.0",
    "numpy>=2.5.4",
    "ollama>=0.6.3",
    "openwakeword>=0.6",
    "pillow>=13.0.0",
    "piper-tts>=1.8.0",
    "psutil>=7.2.2",
    "psycopg[binary]>=3.3.6",
    "pycaw>=20260927",
    "pyperclip>=1.11.0",
    "pystray>=0.19.5",
    "python-dotenv>=1.2.4",
    "sounddevice>=0.5.6",
    "trafilatura>=2.3.1",
]

[project.scripts]
ordis = "ordis:main"

[project.gui-scripts]
ordis-tray = "ordis:tray"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
environments = ["sys_platform == 'win32'"]
